<!doctype html><html lang="ko"><meta charset="utf-8"><title>18 · 그룹 생성 전 최종 확인</title><style>body{font:16px -apple-system,sans-serif;background:#f4f4f4;color:#222;margin:28px;line-height:1.65}main{max-width:1050px;margin:auto}.pair{display:flex;gap:24px;align-items:start;overflow:auto;background:white;padding:24px;border-radius:16px}figure{margin:0;flex:none}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:393px}.issue{background:#fff4df;padding:16px;border-radius:12px}</style><main><h1>18 · 그룹 생성 전 최종 확인</h1><p>17번 오류 화면 승인 완료 · 다음 화면 검수</p><p class="issue">수정 제안: ‘추가·변경’ 아이콘과 글자를 약4pt 오른쪽으로, 글자 줄높이를19→28pt로 맞추기. 아직 코드 수정 전입니다.</p><div class="pair"><figure><figcaption>Figma 원본 · 393×852</figcaption><img src="00_figma_group_final.png" alt="Figma 그룹 생성 전 최종 확인"></figure><figure><figcaption>18 · 현재 제품 위젯 캡처</figcaption><img src="18_group_final_widget.png" alt="앱 그룹 생성 전 최종 확인"></figure></div><p>입력창·목록·하단 버튼의 위치/크기와 주요 폰트·색상을 측정했습니다. 구성원 아이콘 y에는 ±0.25pt 차이가 있습니다.</p><p>앱 이미지는 위젯 테스트 캡처이며 실제 시뮬레이터 스크린샷은 아닙니다. 이름·ID·글자 수와 ON/OFF는 데이터 및 기존 승인 정책 차이입니다.</p><p><a href="README.md">상세 측정 및 확인 범위</a></p></main></html>
